name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: stash-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: iOS (macOS cloud)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install CocoaPods deps
        run: |
          cd ios
          pod install --repo-update

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Compiles iOS without Apple signing (proves cloud Mac build works).
      # For a device-installable IPA you need an Apple Developer account + certificates.
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Zip Runner.app for download
        run: |
          mkdir -p artifacts
          cd build/ios/iphoneos
          zip -r "$GITHUB_WORKSPACE/artifacts/stash-ios-unsigned.zip" Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: stash-ios-unsigned
          path: artifacts/stash-ios-unsigned.zip
